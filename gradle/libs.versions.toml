jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
dnsjava = { module = "dnsjava:dnsjava", version.ref = "dnsjava" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }
quickjs-android = { module = "wang.harlon.quickjs:wrapper-android", version.ref = "quickjs" }
lucide = { module = "com.composables:icons-lucide-android", version.ref = "lucide" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
