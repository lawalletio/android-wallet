hummingbird = { module = "com.sparrowwallet:hummingbird", version.ref = "hummingbird" }
cbor = { module = "co.nstant.in:cbor", version.ref = "cbor" }
bdk-android = { module = "org.bitcoindevkit:bdk-android", version.ref = "bdk" }
