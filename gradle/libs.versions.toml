[versions]
agp = "9.4.1"
kotlin = "2.3.20"
composeBom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
coreKtx = "1.19.1"
appcompat = "1.8.0"
credentials = "1.6.0"
camerax = "1.6.2"
mlkitBarcode = "17.3.0"
biometric = "1.1.0"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"
secp256k1 = "0.24.0"
bouncycastle = "1.86"
zxing = "3.5.4"
coil = "3.3.0"
lottie = "6.7.1"
work = "2.12.0"
lucide = "2.2.1"
haze = "1.7.3"
splashscreen = "1.2.0"
profileinstaller = "1.4.1"
benchmark = "1.5.0"
uiautomator = "2.4.0"
testRunner = "1.7.0"
junit = "4.13.2"
robolectric = "4.18.1"
roborazzi = "1.79.0"
androidxJunit = "1.3.0"
testRules = "1.7.0"
sentry = "8.61.1"
sentryGradle = "6.24.0"
leakcanary = "2.14"
playAppUpdate = "2.1.0"
reorderable = "3.1.0"
# 16 KB-aligned .so (Play, targetSdk 35+); quickjs-kt 1.0.0-alpha13 is 4 KB-aligned.
quickjs = "3.2.3"
# Cashu: animated QR (BC-UR fountain codes, NUT-16) and cashuB (CBOR) tokens.
hummingbird = "1.7.6"
cbor = "0.9"
# Onchain wallets: descriptors, sync, coin selection, PSBT, RBF (16 KB-aligned .so since 2.2).
bdk = "3.1.1"
# The Payjoin Dev Kit bindings (org.payjoindevkit) load their .so through JNA, the version bdk-android brings.
jna = "5.14.0"
# BIP-353 names: DNS over HTTPS answers, DNSSEC validated on the phone (never trusting the resolver).
dnsjava = "3.7.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
