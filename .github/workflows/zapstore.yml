name: Zapstore
# Publishes each GitHub release to Zapstore with zsp (zapstore.yaml + fastlane/metadata), signed by the
# maintainer's NIP-46 remote signer. Needs the ZAPSTORE_BUNKER secret: the signer's bunker:// string.
on:
  # The Release workflow creates its release with GITHUB_TOKEN, and events made with that token start no
  # workflows, so `release` alone would never fire for tagged releases: follow the workflow instead.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Releases published by hand.
  release:
    types: [published]
  workflow_dispatch:

# One publish at a time; zsp exits 0 when the release is already on Zapstore.
concurrency:
  group: zapstore
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    # The signer may wait for approval (nsec.app asks on a new connection): don't hang for hours.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # zsp publishes GitHub's *latest* release. Never let that move the listing backwards: the latest release must be
      # the highest version, and the one this run was started for.
      - name: Never publish an older version
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch || github.event.release.tag_name }}
        run: |
          latest=$(gh release view --json tagName -q .tagName)
          highest=$(gh release list --limit 200 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName' | sort -V | tail -1)
          echo "latest release: $latest · highest version: $highest · started for: ${RUN_TAG:-manual run}"
          if [ "$latest" != "$highest" ]; then echo "::error::The latest release ($latest) isn't the highest version ($highest): refusing to publish an older version"; exit 1; fi
          if [ -n "$RUN_TAG" ] && [ "$RUN_TAG" != "$latest" ]; then echo "::error::Started for $RUN_TAG, but the latest release is $latest: refusing"; exit 1; fi
      - name: Install zsp
        run: go install github.com/zapstore/zsp@v0.4.14
      - name: Publish
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_BUNKER }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SIGN_WITH" ]; then echo "::error::Add the ZAPSTORE_BUNKER secret (the signer's bunker:// string)"; exit 1; fi
          "$(go env GOPATH)/bin/zsp" publish --quiet --verbose zapstore.yaml
