name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to (internal, alpha, beta, production) — empty skips Play
        required: false
        default: internal

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android API 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.LAWALLET_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB + per-ABI APKs
        env:
          LAWALLET_KEYSTORE: ${{ runner.temp }}/upload.jks
          LAWALLET_KEYSTORE_PASSWORD: ${{ secrets.LAWALLET_KEYSTORE_PASSWORD }}
          LAWALLET_KEY_ALIAS: ${{ secrets.LAWALLET_KEY_ALIAS }}
          LAWALLET_KEY_PASSWORD: ${{ secrets.LAWALLET_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION_NAME="0.0.0-$(git rev-parse --short HEAD)"
          VERSION_CODE=$(git rev-list --count HEAD)
          ./gradlew testDebugUnitTest lintRelease bundleRelease assembleRelease \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" -PabiSplits
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
      - name: Upload to Google Play
        if: env.PLAY_JSON != '' && (startsWith(github.ref, 'refs/tags/') || inputs.track != '')
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.lawallet.wallet
          releaseFiles: app/build/outputs/bundle/release/*.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          status: completed
