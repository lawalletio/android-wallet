        ref: RemoteWalletDetail
        route: "settings/remote-wallets/{id}"
        source: ui/screens/RemoteWallets.kt
        state: Live NWC wallet with a forward plan
        reach: RemoteWallets › WalletRow, or Home › BalanceFigure (long-press)
        summary: "One wallet: balance, capabilities, connection string, relays, receive actions."
        components:
          - {name: StatusToggle, sel: "tag:wallet-status-toggle", does: "Live / Paused"}
          - {name: WalletName, sel: "text:Alby Hub", does: Title}
          - {name: RenameButton, sel: "tag:wallet-rename", does: Rename}
          - {name: KindIcon, sel: "tag:wallet-kind", does: "NWC / LNCurl"}
          - {name: WalletBalance, sel: "tag:wallet-balance", does: Balance}
          - {name: CapabilityBadges, sel: ["desc:LUD-21", "desc:NIP-57"], does: "LUD-21 verify / NIP-57 zaps support"}
          - {name: SetPrimaryRow, sel: "text:Set primary", does: Make default}
          - {name: ConnectionString, sel: ["text:Connection string", "text:Copy"], does: "Masked NWC URI; Reveal / Copy"}
          - {name: Relays, sel: "tag:wallet-relays", does: Relay chips}
          - {name: ForwardPlan, sel: ["text:On receive", "text:Edit plan"], does: "Fee + split of incoming payments to other addresses"}
      - id: 52-remote-wallet-detail-bottom
        name: RemoteWalletDetail
        ref: "RemoteWalletDetail[Bottom]"
        route: "settings/remote-wallets/{id}"
        source: ui/screens/RemoteWallets.kt
        state: Scrolled down
        reach: Scroll
        summary: Notifications and deletion.
        components:
          - {name: WebhookRow, sel: ["text:Shop webhook", "text:WEBHOOK"], does: "Webhook on payment; toggle enables"}
          - {name: AddWebhookRow, sel: "text:Add webhook", does: New webhook}
          - {name: DeleteWalletRow, sel: "text:Delete wallet", does: Destructive}
      - id: 53-remote-wallet-add
        name: AddRemoteWallet
        ref: AddRemoteWallet
        route: settings/remote-wallets-add
        source: ui/screens/RemoteWallets.kt
        state: Choice
        reach: AddWalletButton (deck or list)
        summary: Import an existing NWC wallet or create a disposable LNCurl one.
        components:
          - {name: ImportNwcButton, sel: "tag:add-nwc", does: "→ ImportNwc"}
          - {name: CreateLncurlButton, sel: "tag:add-lncurl", does: Creates a hosted LNCurl wallet}
      - id: 54-remote-wallet-import
        name: ImportNwc
        ref: ImportNwc
        route: settings/remote-wallets-add
        source: ui/screens/RemoteWallets.kt
        state: Empty
        reach: AddRemoteWallet › ImportNwcButton
        summary: Paste or scan a nostr+walletconnect URI.
        components:
          - {name: NwcField, sel: "tag:wallet-nwc", does: Connection URI}
          - {name: ScanButton, sel: "tag:wallet-scan", does: Scan QR}
          - {name: NameField, sel: "tag:wallet-name", does: Optional name}
          - {name: MakePrimaryToggle, sel: "box:864,1957,1001,2083", does: Set as default}
          - {name: ConnectButton, sel: "tag:wallet-connect", does: Connect}

  - title: Onchain wallets
    screens:
      - id: 40-onchain-create
        name: CreateOnchainWallet
        ref: CreateOnchainWallet
        route: onchain/create
        source: ui/screens/Onchain.kt
        state: Defaults (Native SegWit, 12 words)
        reach: "Home[Onchain] › AddWalletButton › Create (gated by ONCHAIN_SOON in release UI)"
        summary: Generates a local BIP-39 wallet.
        components:
          - {name: NameField, sel: "tag:onchain-name", does: Wallet name}
          - {name: ScriptNativeSegwit, sel: "tag:script-P2WPKH", does: "BIP84, Recommended (selected)"}
          - {name: ScriptTaproot, sel: "tag:script-P2TR", does: BIP86}
          - {name: ScriptNested, sel: "tag:script-P2SH_P2WPKH", does: BIP49}
          - {name: ScriptLegacy, sel: "tag:script-P2PKH", does: BIP44}
          - {name: PhraseLengthTabs, sel: ["tag:bunker-tab-0", "tag:bunker-tab-1"], does: "12 / 24 words (tag reused from BunkerLogin)"}
          - {name: AdvancedButton, sel: "tag:onchain-advanced", does: Passphrase / account options}
          - {name: CreateButton, sel: "tag:onchain-create", does: "→ OnchainBackup"}
      - id: 41-onchain-backup
        name: OnchainBackup
        ref: "OnchainBackup[Hidden]"
        route: "onchain/backup/{id}"
        source: ui/screens/Onchain.kt
        state: Phrase hidden
        reach: CreateOnchainWallet › CreateButton
        summary: Blurred phrase until tapped.
        components:
          - {name: Warning, sel: "text:Write these words", does: Instructions}
          - {name: RevealArea, sel: "tag:onchain-reveal", does: Tap to reveal}
          - {name: WroteItButton, sel: "tag:onchain-written", does: "→ verify"}
          - {name: LaterButton, sel: "tag:onchain-later", does: Skip (backup reminder stays)}
      - id: 42-onchain-backup-revealed
        name: OnchainBackup
        ref: "OnchainBackup[Revealed]"
        route: "onchain/backup/{id}"
        source: ui/screens/Onchain.kt
        state: Phrase visible (dummy wallet, no funds)
        reach: Tap RevealArea
        summary: Two-column numbered word grid.
        components:
          - {name: WordGrid, sel: "tag:onchain-words", does: 12 numbered words}
      - id: 43-onchain-verify
        name: OnchainBackup
        ref: "OnchainBackup[Verify]"
        route: "onchain/backup/{id}"
        source: ui/screens/Onchain.kt
        state: Quiz
        reach: OnchainBackup › WroteItButton
        summary: Pick the right word for 3 random positions.
        components:
          - {name: WordQuestion, sel: ["text:Word #1", "tag:verify-0-north"], does: "Three choices per position (`verify-<i>-<word>`)"}
          - {name: DoneButton, sel: "tag:onchain-verify", does: "Confirms → Home[Onchain·WalletDeck]"}
      - id: 45-onchain-wallet-detail
        name: OnchainWalletDetail
        ref: OnchainWalletDetail
        route: "onchain/wallet/{id}"
        source: ui/screens/Onchain.kt
        state: Primary, empty
        reach: "OnchainWalletCard › hold › See details"
        summary: Balance and wallet facts.
        components:
          - {name: Balance, sel: "tag:onchain-wallet-balance", does: Balance + Primary chip}
          - {name: DetailsCard, sel: ["text:Type", "text:m/84'/0'/0'"], does: "Script type, derivation path"}
          - {name: RecoveryPhraseRow, sel: "text:Recovery phrase", does: "→ OnchainBackup"}
          - {name: RenameRow, sel: "text:Rename", does: Rename}
          - {name: RemoveRow, sel: "text:Remove wallet", does: Destructive}

appendix:
  - title: Not captured in this edition
    body:
      - ul:
          - "Lock screen (needs a device credential on the emulator), CreateAccount / CreatePasskey / Welcome (new-account flows), EmailAuth, Activate (card activation token), Withdraw (LNURL-w), Sweep and Transfer, OnchainImport, AddOnchainWallet, Profile with real Nostr metadata, error/offline states."
          - "To add one: capture it (see the next page) and add an entry to `guide.yaml`."
  - title: How to update this guide
    body:
      - p: "Everything is in `docs/ui-guide/`: `mock/server.py` (dummy instance), `ui.py` (emulator driver), `shots/` (PNG + view hierarchy per screen), `guide.yaml` (names, states, markers, prose) and `build.py` (renders this PDF). Full instructions: `docs/ui-guide/README.md`."
      - pre: |
          # 1. dummy backend (LaWallet API + relay + NWC wallets) on :8787
          docs/ui-guide/.venv/bin/python docs/ui-guide/mock/server.py
          # 2. side-by-side app pointed at it (never touches a real install)
          ./gradlew assembleDebug -PidSuffix=.guide && adb install -r app/build/outputs/apk/debug/app-debug.apk
          # 3. drive + capture
          ui.py route settings/cards ; ui.py shot 32-settings-cards ; ui.py nodes 32-settings-cards
          # 4. edit guide.yaml (names / selectors / text) and rebuild
          docs/ui-guide/.venv/bin/python docs/ui-guide/build.py      # WARN lines = selectors that stopped matching
      - table:
          - [When the app changes…, Do this]
          - [A screen looks different, "Re-shoot it with the same id (`ui.py shot <id>`), rebuild"]
          - [A component was renamed/moved, "Rebuild; fix the `sel:` the WARN line names (`ui.py nodes <id>` lists tags/text/bounds)"]
          - [A new screen, "Shoot it with a new id, add an entry under the right section"]
          - [A new state of a screen, "New id with the same name and a different `ref: Name[State]`"]
          - [New dummy data needed, "Edit WALLETS / TXS / ADDRESSES / CARDS in `mock/server.py`, restart it, pull-to-refresh"]
