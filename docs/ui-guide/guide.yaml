# LaWallet Android — UI reference guide (source of the PDF).
#
# Each screen:  id (= shots/<id>.png + .xml), name, ref (how to cite it), route (R0 value), source file,
#               state, reach (how to get there), summary, gestures, components.
# Component sel: tag:<testTag>[#n] | text:<visible text> | desc:<content description> | box:x1,y1,x2,y2 | [list → union]
# Gesture arrow: [x1, y1, x2, y2] in screenshot pixels (1080×2400); optional at: [x, y] for the label.
# Rebuild: docs/ui-guide/.venv/bin/python docs/ui-guide/build.py   (see docs/ui-guide/README.md)

title: LaWallet Android — UI Guide
subtitle: "Every screen, state and component, named and numbered — so a change can be described in plain words, e.g. **“Home[Lightning·Docked] › BalanceFigure: make it smaller”**."
generated: "Captured on the LaWallet_API_36 emulator (1080×2400, 420 dpi) against the mock instance in `docs/ui-guide/mock` — every balance, wallet, address and transaction is dummy data. Build: `docs/ui-guide/build.py`."

intro:
  - title: How to reference things
    body:
      - p: "Every screen has a **Name** (PascalCase) and an **id** (the black chip on its page, also the screenshot file name). Every numbered marker on a screenshot is a **Component** with its own Name. Cite them with this grammar:"
      - pre: |
          Screen › Component                       Settings › LanguagePicker
          Screen[State] › Component                Home[Lightning·WalletDeck] › WalletCard
          Screen › Component › Part                Home › TabBar › ScanButton
          Screen › Component (gesture)             Home › BalanceFigure (long-press)
      - p: "The grey monospace text under each component name is its **selector**. `tag:` values are the Compose `testTag` in the source — grep for it to find the exact code (e.g. `grep -rn '\"balance-toggle\"' app/src`). `text:` selectors are the English copy at capture time."
      - h: Example change requests
      - ul:
          - "“Home[Lightning·Docked] › SwipeHint: hide it after the first time the deck is opened.”"
          - "“Home › TabBar › ScanButton: use the page tone only on Lightning; keep it neutral on Onchain and USDT.”"
          - "“ActivityDetail › ProofToggle: rename to ‘Show proof’ and open it by default for pending payments.”"
          - "“Send[Amount] › MaxChip: move it to the right of the AvailableBalance line.”"
      - h: States vocabulary
      - table:
          - [State word, Meaning]
          - [Docked, "Home's default vertical position: balance in the middle, activity peeking below"]
          - [WalletDeck, "Home swiped down: the wallet cards fan out above the balance (the balance moves to the bottom)"]
          - [ActivityRaised, "Home's activity panel dragged up to full height; the TabBar is replaced by search + filters"]
          - ["Lightning / Onchain / USDT", "Home's three horizontal pages (Lightning in the middle, opens there)"]
          - [Hidden, "Balance masked with •••••"]
          - [Empty, "A list with no items (e.g. no onchain wallets)"]
          - [Filled, "A form with input entered"]
          - [Sheet, "A bottom sheet over the screen (ActionSheet)"]
          - [Dialog, "A centered modal (LwAlertDialog)"]
  - title: Shared components (appear on many screens)
    body:
      - p: "Defined once in `ui/components` / `ui/theme` and reused. When a change should apply app-wide, name the shared component instead of a screen."
      - table:
          - [Name, Where / tag, What it is]
          - [BackButton, "`header-back` (ScreenHeader)", "Round glass button top-left; pops the screen (some screens show it as ✕ Close)"]
          - [ScreenTitle, ScreenHeader, "Large left-aligned title under the BackButton, or centered small title on flow screens (Send, Receive, Amount)"]
          - [TabBar, "`nav-receive` / `nav-scan` / `nav-send` (NavTabBar)", "Floating glass bar on Home and Settings: Receive · Scan (round, page-tinted) · Send. Hidden while Home's activity is raised"]
          - [CurrencySwitcher, "`currency-SAT` / `currency-USD` / `currency-ARS`", "Segmented pill under any big amount; switches the display unit (active currencies come from Settings › Currency)"]
          - [PrimaryButton, "LwButton (Theme variant)", "Full-width bottom action (Continue, Connect, Create wallet…)"]
          - [GhostButton, "LwButton (Ghost variant)", "Outlined secondary action (Later, Use default…)"]
          - [SettingsRow, "SettingsRow in Basics.kt", "Glass row with icon, label, optional value and chevron or Toggle"]
          - [Toggle, "Switch inside a SettingsRow", "On/off preference"]
          - [Keypad, "`key-0`…`key-9`, `key-backspace`", "Numeric keypad on amount screens (no system keyboard)"]
          - [ActionSheet, "SheetAction rows", "Bottom sheet with a header card and icon+label actions; red label = destructive"]
          - [AlertDialog, "LwAlertDialog / ModalAction", "The one modal style app-wide: ✕ top-left, message, one full-width action"]
          - [Receipt, "PaymentReceipt: `receipt-amount`, `proof-toggle`, `share-text`, `share-image`, `done`", "Shared by ActivityDetail, Send summary and Receive summary"]
          - [PaymentNotice, "`payment-notice`", "Glass pill at the top (‘Received +5,000 sats’) for ~2.7 s after a payment, on every screen except Home·Lightning (which animates its balance instead)"]
          - [OfflineBadge, "`offline-badge`", "Small orange ‘Offline’ pill at the top when the instance API is unreachable"]
          - [PrismBackground, "theme", "Blurred backdrop; on Home it is tinted by the page tone (Onchain orange, Lightning blue, USDT teal)"]
          - [Glass, "theme", "Frosted translucent surface used by cards, pills, the TabBar and sheets"]

sections:
  - title: Onboarding (logged out)
    screens:
      - id: 01-landing
        name: Landing
        ref: Landing
        route: landing
        source: ui/screens/Onboarding.kt
        state: Logged out, first launch
        reach: Fresh install, or after Log out / Remove wallet
        summary: Brand isotype and the instance's community name with a one-line pitch; two stacked buttons at the bottom.
        components:
          - {name: CommunityName, sel: "text:LaWallet Demo", does: "`community_name` from the instance `/api/settings` (default instance shows ‘La Wallet’)"}
          - {name: Tagline, sel: "text:Manage and store", does: Static pitch copy}
          - {name: CreateAccountButton, sel: "tag:landing-create", does: "→ SignupChoice"}
          - {name: LoginButton, sel: "tag:landing-login", does: "→ Login"}
      - id: 02-signup
        name: SignupChoice
        ref: SignupChoice
        route: signup
        source: ui/screens/Onboarding.kt
        state: Logged out
        reach: Landing › CreateAccountButton
        summary: Four ways to create an account, ordered from simplest (passkey) to most technical (existing key).
        components:
          - {name: BackButton, sel: "tag:header-back", does: Back to Landing}
          - {name: Title, sel: "text:Create your account", does: Screen title + explainer}
          - {name: PasskeyButton, sel: "text:Create with a passkey", does: "Creates a key from a device passkey (PRF) → CreatePasskey"}
          - {name: EmailButton, sel: "tag:login-email", does: "→ EmailLogin (magic link)"}
          - {name: RandomKeyButton, sel: "tag:signup-random", does: "Generates a fresh Nostr key → CreateAccount"}
          - {name: ExistingKeyButton, sel: "text:I already have a key", does: "→ NostrLogin"}
      - id: 03-login
        name: Login
        ref: Login
        route: login
        source: ui/screens/Onboarding.kt
        state: Logged out
        reach: Landing › LoginButton
        summary: Login hub. Passkey is primary; email and Nostr are alternatives; a footer links back to signup.
        components:
          - {name: BackButton, sel: "tag:header-back", does: Back}
          - {name: PasskeyButton, sel: "text:Continue with passkey", does: Credential Manager passkey sign-in}
          - {name: OrDivider, sel: "text:or", does: Separator}
          - {name: EmailButton, sel: "tag:login-email", does: "→ EmailLogin"}
          - {name: NostrButton, sel: "tag:login-nostr", does: "→ NostrLogin"}
          - {name: SignupLink, sel: ["text:New to LaWallet?", "text:Create an account"], does: "→ SignupChoice"}
      - id: 04-login-email
        name: EmailLogin
        ref: EmailLogin
        route: login/email
        source: ui/screens/EmailLogin.kt
        state: Empty, keyboard dismissed
        reach: Login › EmailButton (only when the instance has `email_login_enabled`)
        summary: Single field that sends a magic link; the link opens `auth/email` which finishes login.
        components:
          - {name: BackButton, sel: "tag:header-back", does: Back}
          - {name: Title, sel: "text:Continue with email", does: Title + explainer}
          - {name: EmailField, sel: "tag:email-input", does: Autofocused email input}
          - {name: SendLinkButton, sel: "tag:email-send", does: "POST /api/auth/email/request; then shows ‘check your inbox’"}
      - id: 05-login-nostr
        name: NostrLogin
        ref: NostrLogin
        route: login/nostr
        source: ui/screens/Onboarding.kt
        state: Empty
        reach: Login › NostrButton
        summary: Paste a private key, or delegate signing to Amber (NIP-55) or a remote signer (NIP-46).
        components:
          - {name: BackButton, sel: "tag:header-back", does: Back}
          - {name: PrivateKeyField, sel: "tag:nsec-input", does: "nsec or hex private key; stored wrapped by the Android Keystore"}
          - {name: ScanKeyButton, sel: "box:892,651,1018,777", does: Scan an nsec QR}
          - {name: LoginButton, sel: "tag:nsec-submit", does: "Mints a JWT (NIP-98) and loads `/api/users/me` → Home"}
          - {name: AmberButton, sel: "text:Continue with Amber", does: External signer app}
          - {name: BunkerButton, sel: "tag:login-bunker", does: "→ BunkerLogin"}
      - id: 06-login-bunker
        name: BunkerLogin
        ref: BunkerLogin
        route: login/bunker
        source: ui/screens/BunkerLogin.kt
        state: "‘Scan or paste’ tab"
        reach: NostrLogin › BunkerButton (asks for camera permission the first time)
        summary: Two tabs — paste/scan a `bunker://` string, or show a `nostrconnect://` QR for the signer to scan.
        components:
          - {name: BackButton, sel: "tag:header-back", does: Back}
          - {name: ScanOrPasteTab, sel: "tag:bunker-tab-0", does: Selected tab}
          - {name: ShowQrTab, sel: "tag:bunker-tab-1", does: Shows a nostrconnect QR + relay list}
          - {name: BunkerField, sel: "tag:bunker-input", does: "bunker:// connection string"}
          - {name: ScanButton, sel: "tag:bunker-scan", does: Scan a bunker QR}
          - {name: ConnectButton, sel: "tag:bunker-connect", does: Connects and logs in}

  - title: Home
    pages:
      - title: "Home — gesture map"
        body:
          - p: "Home is one screen with **3 horizontal pages** and **3 vertical layers**. Swiping horizontally anywhere changes the page (the backdrop tone, header pill, balance label and TabBar tint cross-fade 1:1 with the finger). Swiping down on the balance opens the **WalletDeck**; swiping up on the activity raises it (**ActivityRaised**). The deck stays open when you change page."
          - home_map: true
      - title: "Home — gestures, taps and long-presses"
        body:
          - p: "Everything Home reacts to, across all pages. Component names refer to the Home pages that follow."
          - table:
              - [Gesture, Where, Result]
              - ["Swipe ← / →", Anywhere on Home, "Lightning ⇄ USDT / Onchain ⇄ Lightning"]
              - [Tap PageDots, "`home-pages`", Jumps to the tapped page]
              - ["Swipe ↓", "Balance area (docked)", "WalletDeck: cards slide in above, balance moves down to ‘Primary balance’"]
              - ["Swipe ↑ / Back", WalletDeck open, Closes the deck]
              - ["Swipe ↑", Activity list (docked), "ActivityRaised: list fills the screen, TabBar morphs into ActivitySearch + Filters"]
              - ["Swipe ↓ / Back", ActivityRaised, Docks the activity again]
              - [Tap BalanceFigure, Docked, "Hide / show the balance (•••••)"]
              - [Long-press BalanceFigure, Lightning, "Opens the primary remote wallet's detail (RemoteWalletDetail)"]
              - [Tap AddressPill, Lightning, "→ Receive"]
              - [Long-press AddressPill, Lightning, "Pill expands into LightningAddresses (shared-element animation)"]
              - [Tap Avatar, Any page, "Avatar flies into Profile (shared element)"]
              - [Tap WalletCard, WalletDeck, Makes that wallet primary (optimistic)]
              - [Long-press WalletCard, WalletDeck, Opens WalletActionSheet]
    screens:
      - id: 10-home-lightning
        name: Home
        ref: "Home[Lightning·Docked]"
        route: home
        source: ui/screens/Home.kt, HomeActivitySheet.kt
        state: Lightning page, docked, balance visible, SAT
        reach: App start when logged in; any `goHome()`
        summary: "The wallet's front page. Header row, balance hero with currency switcher, page dots, then today's activity grouped by day. The Lightning watermark (⚡) and blue tone mark the page."
        gestures:
          - {label: "Swipe ↓ wallet deck", arrow: [150, 470, 150, 1000], at: [40, 1060], does: "Opens Home[Lightning·WalletDeck]"}
          - {label: "Swipe ↑ activity", arrow: [930, 1900, 930, 1380], at: [600, 1960], does: "Raises the activity → Home[Lightning·ActivityRaised]"}
          - {label: "← Swipe → pages", arrow: [380, 1100, 700, 1100], at: [330, 1170], does: "Right → Onchain page; left → USDT page"}
        components:
          - {name: Avatar, sel: "tag:avatar", does: "User picture (community isotype when none). Tap → Profile"}
          - {name: AddressPill, sel: "tag:home-address", does: "Primary Lightning address. Tap → Receive; long-press → LightningAddresses. On other pages shows the page's wallet name"}
          - {name: SettingsButton, sel: "tag:home-settings", does: "→ Settings"}
          - {name: SwipeHint, sel: "tag:home-swipe-hint", does: "Two chevrons hinting the WalletDeck; fade as it opens"}
          - {name: BalanceLabel, sel: ["text:Lightning", "text: balance"], does: "‘Lightning balance’ — the page word slides with the swipe"}
          - {name: BalanceFigure, sel: "tag:balance-toggle", does: "Odometer figure (`balance`). Tap hides/shows; long-press → primary wallet detail. Tints green/red while a payment lands"}
          - {name: CurrencySwitcher, sel: ["tag:currency-SAT", "tag:currency-ARS"], does: Display unit for every amount on Home}
          - {name: PageDots, sel: "tag:home-pages", does: "Onchain · Lightning · USDT indicator; tap a dot to jump"}
          - {name: ActivityGrabber, sel: "box:480,1268,600,1300", does: Drag handle of the activity panel}
          - {name: DayHeader, sel: "text:Today", does: "Group label (Today, Yesterday, weekday, date)"}
          - {name: TxRow, sel: "tag:tx-row", does: "Icon (↙ in green / ↗ out orange), description or address, relative time, signed amount. Tap → ActivityDetail"}
          - {name: TabBar, sel: ["tag:nav-receive", "tag:nav-send"], does: "Receive · Scan · Send (see shared components); ScanButton takes the page tone"}
      - id: 11-home-wallets
        name: Home
        ref: "Home[Lightning·WalletDeck]"
        route: home
        source: ui/screens/HomeWallets.kt
        state: Lightning page, deck open (4 remote wallets)
        reach: "Home[Lightning·Docked] › swipe ↓ on the balance"
        summary: "Remote wallets fan out above the balance; the balance moves down and is relabelled ‘Primary balance’. A total sums every live wallet. Balances are polled every 10 s while open."
        gestures:
          - {label: "Swipe ↑ / Back closes", arrow: [940, 1600, 940, 1300], at: [560, 1360], does: Closes the deck back to Docked}
          - {label: "Tap = make primary · Hold = menu", does: "On a WalletCard (see WalletActionSheet)"}
        components:
          - {name: DeckTitle, sel: "text:Remote wallets", does: "Tap → RemoteWallets (manage list)"}
          - {name: AddWalletButton, sel: "tag:home-wallets-add", does: "→ AddRemoteWallet"}
          - {name: WalletCard (paused), sel: "tag:home-wallet-Old phone wallet", does: "DISABLED wallet: ‘Paused’ subtitle, balance shown as —"}
          - {name: WalletCard, sel: "tag:home-wallet-Alby Hub", does: "Name, kind (NWC / LNCurl), live balance (`home-wallet-balance-<name>`)"}
          - {name: WalletCard (primary), sel: "tag:home-wallet-LaWallet", does: "The default wallet — the one Home's balance and activity show"}
          - {name: DeckTotal, sel: "tag:home-wallets-total", does: Sum of all wallet balances}
          - {name: PrimaryBalance, sel: "tag:balance-toggle", does: "The primary wallet's balance, now at the bottom"}
      - id: 12-home-wallet-menu
        name: WalletActionSheet
        ref: "Home[Lightning·WalletDeck] › WalletActionSheet"
        route: home
        source: ui/screens/HomeWallets.kt
        state: Sheet over the deck
        reach: Long-press a WalletCard
        summary: ActionSheet for one remote wallet. Tapping outside or Back closes it.
        components:
          - {name: SheetHeader, sel: ["text:Alby Hub", "text:NWC · 1,250,000"], does: "Wallet name, kind and balance"}
          - {name: SeeDetailsAction, sel: "text:See details", does: "→ RemoteWalletDetail"}
          - {name: RenameAction, sel: "text:Rename", does: Rename dialog}
          - {name: TransferAction, sel: "text:Transfer amount", does: Move a chosen amount to another wallet}
          - {name: SweepAction, sel: "text:Sweep funds", does: "Pick a destination wallet → Sweep (moves everything)"}
          - {name: DeleteAction, sel: "text:Delete wallet", does: "Destructive (red). A wallet with funds is swept first"}
      - id: 14-home-activity-raised
        name: Home
        ref: "Home[Lightning·ActivityRaised]"
        route: home
        source: ui/screens/HomeActivitySheet.kt, ActivitySearch.kt
        state: Activity raised, no filters
        reach: "Home[Lightning·Docked] › swipe ↑ on the activity"
        summary: "The activity takes the whole screen with an ‘Activity’ title. The TabBar is swapped (1:1 with the drag) for the ActivitySearch field and Filters button. Scrolling to the end loads older pages (`list_transactions` with `until`)."
        gestures:
          - {label: "Swipe ↓ / Back docks", arrow: [540, 250, 540, 420], at: [580, 330], does: "Back to Home[Lightning·Docked]"}
        components:
          - {name: Grabber, sel: "box:480,80,600,110", does: Drag handle}
          - {name: ActivityTitle, sel: "text:Activity", does: Pinned title while raised}
          - {name: DayHeader, sel: "text:Yesterday", does: Day group}
          - {name: TxRow (received), sel: "tag:tx-row#1", does: "Incoming: green ↙ and +amount"}
          - {name: TxRow (sent), sel: "tag:tx-row#2", does: "Outgoing: orange ↗ and −amount; a Lightning address as title when that's what was paid"}
          - {name: TxRow (pending), sel: "tag:tx-row#8", does: "‘Pending’ instead of time; faded"}
          - {name: ActivitySearch, sel: "tag:activity-search", does: Filters rows by description/address as you type}
          - {name: FiltersButton, sel: "tag:activity-filters", does: "Opens ActivityFilters; a dot marks active filters"}
      - id: 15-activity-filters
        name: ActivityFilters
        ref: "Home[ActivityRaised] › ActivityFilters"
        route: home
        source: ui/screens/ActivitySearch.kt
        state: Filters popover open, none active
        reach: "Home[ActivityRaised] › FiltersButton"
        summary: Glass popover above the search bar.
        components:
          - {name: SentChip, sel: "tag:filter-sent", does: Only outgoing}
          - {name: ReceivedChip, sel: "tag:filter-received", does: Only incoming}
          - {name: AmountToggle, sel: "tag:filter-amount", does: Enables an amount range}
          - {name: FiltersButton, sel: "tag:activity-filters", does: Closes the popover}
      - id: 16-activity-filter-received
        name: ActivityFilters
        ref: "Home[ActivityRaised·Filtered]"
        route: home
        source: ui/screens/ActivitySearch.kt
        state: "‘Received’ filter active"
        reach: "ActivityFilters › ReceivedChip"
        summary: "Active chip is filled green; a Clear link appears; the FiltersButton gets a dot. The list shows only incoming payments."
        components:
          - {name: ReceivedChip (active), sel: "tag:filter-received", does: Active state}
          - {name: ClearLink, sel: "text:Clear", does: Resets every filter}
          - {name: FilteredList, sel: "tag:tx-row#1", does: Only matching rows}
          - {name: FiltersButton (active dot), sel: "tag:activity-filters", does: Dot = filters on}
      - id: 17-activity-search
        name: ActivitySearch
        ref: "Home[ActivityRaised·Searching]"
        route: home
        source: ui/screens/ActivitySearch.kt
        state: "Query ‘coffee’, keyboard closed"
        reach: "Home[ActivityRaised] › ActivitySearch, type"
        summary: "Matching rows only, then an end-of-list marker."
        components:
          - {name: ResultRow, sel: "tag:tx-row", does: Matching transaction}
          - {name: EndMarker, sel: "text:reached the end", does: No more pages}
          - {name: SearchField, sel: "tag:activity-search", does: Current query}
          - {name: ClearSearch, sel: "desc:Clear search", does: Clears the query}
      - id: 20-home-onchain
        name: Home
        ref: "Home[Onchain·Docked]"
        route: home
        source: ui/screens/HomeOnchain.kt
        state: Onchain page, one local wallet, balance ‘Soon’
        reach: "Home › swipe → (from Lightning)"
        summary: "Same layout as Lightning with an orange Bitcoin tone and ₿ watermark. Onchain sending/receiving is not wired yet (`ONCHAIN_SOON`): the figure reads ‘Soon’ and Receive/Send toast ‘coming soon’."
        gestures:
          - {label: "Swipe ← Lightning", arrow: [900, 1600, 560, 1600], at: [560, 1680], does: "Back to Home[Lightning]"}
        components:
          - {name: AddressPill, sel: "tag:home-address", does: "Primary onchain wallet name with ₿ icon"}
          - {name: BalanceFigure, sel: "tag:onchain-soon", does: "‘Soon’ placeholder"}
          - {name: PageDots, sel: "tag:home-pages", does: First dot active (orange)}
          - {name: OnchainActivity, sel: "text:No onchain transactions yet", does: Empty activity card}
          - {name: TabBar, sel: ["tag:nav-receive", "tag:nav-send"], does: "Orange ScanButton; Receive/Send show a ‘soon’ toast"}
      - id: 21-home-onchain-wallets
        name: Home
        ref: "Home[Onchain·WalletDeck]"
        route: home
        source: ui/screens/HomeOnchain.kt, HomeWallets.kt
        state: Deck open, one wallet
        reach: "Home[Onchain·Docked] › swipe ↓"
        summary: Onchain wallets are local (BIP-39 seed on the device). Hold a card for its menu (See details, Rename).
        components:
          - {name: DeckTitle, sel: "text:Onchain wallets", does: Section title}
          - {name: AddWalletButton, sel: "tag:onchain-wallets-add", does: "→ AddOnchainWallet (create / import)"}
          - {name: OnchainWalletCard, sel: "tag:onchain-wallet-Cold storage", does: "Name, script type, balance; tap = primary, hold = menu"}
          - {name: PrimaryBalance, sel: "tag:onchain-balance-toggle", does: "‘Soon’"}
      - id: 27-home-onchain-raised
        name: Home
        ref: "Home[Onchain·ActivityRaised]"
        route: home
        source: ui/screens/HomeOnchain.kt
        state: Activity raised, empty
        reach: "Home[Onchain·Docked] › swipe ↑"
        summary: Same raise gesture as Lightning, but no search bar — the TabBar stays.
        components:
          - {name: ActivityTitle, sel: "text:Activity", does: Title}
          - {name: EmptyState, sel: "text:No onchain transactions yet", does: Empty card}
      - id: 22-home-usdt
        name: Home
        ref: "Home[USDT·Docked]"
        route: home
        source: ui/screens/HomeUsdt.kt
        state: USDT page (upcoming asset)
        reach: "Home › swipe ← (from Lightning)"
        summary: Teal Tether tone. Placeholder for an upcoming asset; everything reads ‘Soon’.
        components:
          - {name: AddressPill, sel: "tag:home-address", does: "‘USDT’; tap toasts ‘soon’"}
          - {name: BalanceFigure, sel: "tag:usdt-soon", does: "‘Soon’"}
          - {name: UsdtPromo, sel: "text:Digital dollars with USDT", does: "Teaser row with a ‘Soon’ chip"}
          - {name: UsdtActivity, sel: "text:Your USDT activity", does: Empty activity}
      - id: 23-home-usdt-wallets
        name: Home
        ref: "Home[USDT·WalletDeck]"
        route: home
        source: ui/screens/HomeUsdt.kt
        state: Deck open, empty
        reach: "Home[USDT·Docked] › swipe ↓ (or arrive with the deck already open)"
        summary: Empty deck state.
        components:
          - {name: DeckTitle, sel: "text:USDT wallets", does: Title}
          - {name: AddWalletButton, sel: "tag:usdt-wallets-add", does: Disabled for now}
          - {name: EmptyDeck, sel: "text:No USDT wallets yet", does: Empty state with icon}
      - id: 28-home-usdt-raised
        name: Home
        ref: "Home[USDT·ActivityRaised]"
        route: home
        source: ui/screens/HomeUsdt.kt
        state: Activity raised, empty
        reach: "Home[USDT·Docked] › swipe ↑"
        summary: Same as Onchain raised, teal tone.
        components:
          - {name: EmptyState, sel: "text:Your USDT activity", does: Empty card}
      - id: 24-home-usd
        name: Home
        ref: "Home[Lightning·Docked·USD]"
        route: home
        source: ui/screens/Home.kt
        state: CurrencySwitcher on USD
        reach: CurrencySwitcher › USD
        summary: "The figure converts with Yadio rates; all amounts on Home follow the selected unit."
